  "objectives": [
    { "id": "lo1.1", "chapter": "ch1", "text": "Compute present and future values of a single cash flow", "docAnchor": "#Present_value_of_a_future_sum" },
    { "id": "lo1.2", "chapter": "ch1", "text": "Value annuities and perpetuities, and convert an APR to an EAR", "docAnchor": "" },
    { "id": "lo2.1", "chapter": "ch2", "text": "Measure expected return and risk", "docAnchor": "https://en.wikipedia.org/wiki/Standard_deviation" },
    { "id": "lo2.2", "chapter": "ch2", "text": "Explain diversification, beta, and the CAPM", "docAnchor": "" }
  ],
  "terms": [
    { "id": "t-ch1-001", "term": "Present value (PV)", "definition": "The value **today** of a cash flow received in the future, found by discounting it at the required rate of return.\n`PV = FV / (1 + r)^n`", "chapter": "ch1", "objective": "lo1.1", "topics": ["discounting"], "hint": "What would you pay now for money you get later?", "aliases": ["PV"], "docAnchor": "" },
    { "id": "t-ch1-002", "term": "Future value (FV)", "definition": "What an amount invested today grows to after *n* periods of compounding at rate *r*.\n`FV = PV × (1 + r)^n`", "chapter": "ch1", "objective": "lo1.1", "topics": ["compounding"], "hint": "", "aliases": ["FV"], "docAnchor": "" },
    { "id": "t-ch1-003", "term": "Annuity", "definition": "A stream of **equal** payments made at regular intervals for a fixed number of periods. An *ordinary annuity* pays at the end of each period; an *annuity due* pays at the beginning.", "chapter": "ch1", "objective": "lo1.2", "topics": ["annuities"], "hint": "", "docAnchor": "" },
    { "id": "t-ch1-004", "term": "Perpetuity", "definition": "An annuity whose equal payments continue **forever**. Its present value is `PV = C / r`.", "chapter": "ch1", "objective": "lo1.2", "topics": ["annuities", "discounting"], "hint": "", "docAnchor": "" },
    { "id": "t-ch1-005", "term": "Effective annual rate (EAR)", "definition": "The annual rate actually earned once compounding within the year is included.\n`EAR = (1 + APR/m)^m − 1`, where *m* is the number of compounding periods per year.", "chapter": "ch1", "objective": "lo1.2", "topics": ["compounding"], "hint": "A quoted APR ignores compounding; this rate doesn't.", "aliases": ["EAR", "effective annual yield"], "docAnchor": "" },
    { "id": "t-ch2-001", "term": "Expected return", "definition": "The probability-weighted average of the possible returns on an investment: `E(R) = Σ p × R`.", "chapter": "ch2", "objective": "lo2.1", "topics": ["measuring risk"], "hint": "", "docAnchor": "" },
    { "id": "t-ch2-002", "term": "Standard deviation", "definition": "A measure of **total risk**: how widely returns spread around their average. It is the square root of the variance.", "chapter": "ch2", "objective": "lo2.1", "topics": ["measuring risk"], "hint": "", "aliases": ["sigma", "SD"], "docAnchor": "" },
    { "id": "t-ch2-003", "term": "Systematic risk", "definition": "Market-wide risk that affects nearly all assets (recessions, interest-rate changes, inflation) and **cannot** be diversified away. Measured by beta.", "chapter": "ch2", "objective": "lo2.2", "topics": ["diversification"], "hint": "", "aliases": ["market risk", "nondiversifiable risk"], "docAnchor": "" },
    { "id": "t-ch2-004", "term": "Unsystematic risk", "definition": "Risk specific to one company or industry (a lawsuit, a product recall, a CEO leaving) that **can** be eliminated by holding a diversified portfolio.", "chapter": "ch2", "objective": "lo2.2", "topics": ["diversification"], "hint": "", "aliases": ["firm-specific risk", "diversifiable risk"], "docAnchor": "" },
    { "id": "t-ch2-005", "term": "Beta (β)", "definition": "A measure of systematic risk: how strongly an asset's returns move with the market's. The market has β = 1; β = 1.5 means roughly 1.5× the market's swings.", "chapter": "ch2", "objective": "lo2.2", "topics": ["CAPM"], "hint": "", "docAnchor": "" }
  ],
  "questions": [
    {
      "id": "q-ch1-001", "type": "single",
      "stem": "Holding everything else constant, a **higher** discount rate makes the present value of a future cash flow…",
      "options": [
        { "text": "Lower", "correct": true, "concept": "Discounting divides a future amount by `(1 + r)^n`, so the size of *r* sets how much today's equivalent shrinks.", "explain": "Correct: a bigger r makes the divisor bigger, so PV falls. PV and the discount rate move in opposite directions." },
        { "text": "Higher", "correct": false, "concept": "Compounding multiplies today's amount by `(1 + r)^n` to find what it grows to (future value).", "explain": "Not quite: this mixes up PV with FV. A higher rate raises future value but shrinks present value." },
        { "text": "Unchanged", "correct": false, "concept": "A cash flow received today (n = 0) is worth its face amount whatever the rate.", "explain": "Incorrect: that only holds for money received today. For any future cash flow the rate matters." },
        { "text": "It depends on whether the cash flow is positive or negative", "correct": false, "concept": "The sign of a cash flow says whether money comes in or goes out; discounting scales its size.", "explain": "Incorrect: discounting shrinks the size of any future cash flow toward zero, inflow or outflow." }
      ],
      "explanation": "Higher required return → bigger denominator → smaller present value. This inverse relationship drives bond prices and project values.",
      "chapter": "ch1", "objective": "lo1.1", "topics": ["discounting"], "termIds": ["t-ch1-001"], "docAnchor": ""
    },
    {
      "id": "q-ch1-002", "type": "single",
      "stem": "You will receive $1,000 in 3 years. At an annual discount rate of 10%, what is it worth today?",
      "options": [
        { "text": "$751.31", "correct": true, "concept": "Compound discounting divides by `(1 + r)^n`; here `1.10^3 = 1.331`.", "explain": "Correct: $1,000 / 1.331 = $751.31." },
        { "text": "$769.23", "correct": false, "concept": "Simple-interest discounting divides by `1 + r × n`, ignoring interest on interest.", "explain": "Not quite: dividing by 1.30 ignores compounding. TVM problems compound unless told otherwise." },
        { "text": "$1,331.00", "correct": false, "concept": "Multiplying by `(1 + r)^n` moves money forward in time (future value).", "explain": "Incorrect: that is the future value of $1,000 invested today, the opposite direction." },
        { "text": "$700.00", "correct": false, "concept": "Taking a fixed percentage off the face amount each year is a straight-line reduction, not discounting.", "explain": "Incorrect: discounting divides by (1 + r) each year rather than subtracting 10% of the face value." }
      ],
      "explanation": "`PV = 1,000 / 1.10^3 = 751.31`. On a financial calculator: N = 3, I/Y = 10, FV = 1,000, compute PV (shown as −751.31).",
      "chapter": "ch1", "objective": "lo1.1", "topics": ["discounting"], "termIds": ["t-ch1-001"], "docAnchor": ""
    },
    {
      "id": "q-ch1-003", "type": "multi",
      "stem": "Which of the following **increase** the future value of a one-time deposit?",
      "options": [
        { "text": "A higher interest rate", "correct": true, "concept": "Future value grows with `(1 + r)` raised to the number of periods.", "explain": "Correct: a higher r raises (1 + r)^n." },
        { "text": "Leaving the money invested for more years", "correct": true, "concept": "Each extra period adds another round of interest on interest.", "explain": "Correct: a larger n raises (1 + r)^n." },
        { "text": "Compounding more often at the same APR", "correct": true, "concept": "The compounding frequency determines the effective rate earned from a quoted APR.", "explain": "Correct: more frequent compounding raises the EAR, so the deposit grows faster." },
        { "text": "A smaller initial deposit", "correct": false, "concept": "Future value is proportional to the starting amount.", "explain": "Incorrect: a smaller PV gives a proportionally smaller FV." }
      ],
      "explanation": "`FV = PV × (1 + r)^n`: FV rises with PV, r, n, and compounding frequency.",
      "chapter": "ch1", "objective": "lo1.1", "topics": ["compounding"], "termIds": ["t-ch1-002", "t-ch1-005"], "docAnchor": ""
    },
    {
      "id": "q-ch1-004", "type": "single",
      "stem": "A credit card quotes an APR of 12% compounded **monthly**. What is the effective annual rate (EAR)?",
      "options": [
        { "text": "12.68%", "correct": true, "concept": "Monthly compounding applies the periodic rate (APR ÷ 12) twelve times: `(1 + APR/12)^12 − 1`.", "explain": "Correct: 1.01^12 − 1 = 12.68%." },
        { "text": "12.00%", "correct": false, "concept": "The APR is the quoted annual rate before any compounding within the year.", "explain": "Not quite: 12% is the quoted APR; with monthly compounding you actually pay more." },
        { "text": "12.36%", "correct": false, "concept": "Semiannual compounding applies half the APR twice: `(1 + APR/2)^2 − 1`.", "explain": "Incorrect: that is the EAR for 12% compounded twice a year, not monthly." },
        { "text": "1.00%", "correct": false, "concept": "The periodic rate is the APR divided by the number of periods per year.", "explain": "Incorrect: 1% is the monthly rate, not an annual rate." }
      ],
      "explanation": "`EAR = (1 + 0.12/12)^12 − 1 ≈ 12.68%`. More compounding periods → higher EAR.",
      "chapter": "ch1", "objective": "lo1.2", "topics": ["compounding"], "termIds": ["t-ch1-005"], "docAnchor": ""
    },
    {
      "id": "q-ch2-001", "type": "single",
      "stem": "Holding a well-diversified portfolio mainly reduces which kind of risk?",
      "options": [
        { "text": "Unsystematic (firm-specific) risk", "correct": true, "concept": "Firm-specific risk comes from events at one company, such as a lawsuit or a failed product.", "explain": "Correct: company-specific surprises tend to cancel out across many holdings." },
        { "text": "Systematic (market) risk", "correct": false, "concept": "Systematic risk comes from economy-wide forces that hit almost every asset at once.", "explain": "Incorrect: systematic risk can't be diversified away because it affects nearly all assets together." },
        { "text": "Inflation risk", "correct": false, "concept": "Inflation is a rise in the general price level across the whole economy.", "explain": "Incorrect: inflation is a market-wide (systematic) factor, so diversification doesn't remove it." },
        { "text": "None of the above", "correct": false, "concept": "Total risk splits into a market-wide part and a firm-specific part.", "explain": "Incorrect: diversification does reduce risk, namely the firm-specific part." }
      ],
      "explanation": "Total risk = systematic + unsystematic. Diversification removes the unsystematic part, which is why markets reward only systematic risk.",
      "chapter": "ch2", "objective": "lo2.2", "topics": ["diversification"], "termIds": ["t-ch2-003", "t-ch2-004"], "docAnchor": ""
    },
    {
      "id": "q-ch2-002", "type": "multi",
      "stem": "Which of these are sources of **systematic** risk?",
      "options": [
        { "text": "A recession", "correct": true, "concept": "A recession is an economy-wide fall in output and spending.", "explain": "Correct: recessions hurt nearly all companies' sales at once." },
        { "text": "The central bank unexpectedly raising interest rates", "correct": true, "concept": "Interest rates feed into the discount rate used to value every asset.", "explain": "Correct: rate changes move the whole market." },
        { "text": "A company's CEO resigning unexpectedly", "correct": false, "concept": "Leadership changes are events inside a single firm.", "explain": "Incorrect: this is firm-specific (unsystematic) risk, which diversification removes." },
        { "text": "A product recall at one manufacturer", "correct": false, "concept": "A recall affects one company and perhaps its close competitors.", "explain": "Incorrect: it is unsystematic; other holdings in a portfolio offset it." },
        { "text": "Unexpected inflation", "correct": true, "concept": "Changes in the general price level ripple through the whole economy.", "explain": "Correct: inflation surprises affect nearly all assets." }
      ],
      "explanation": "Ask: does this hit almost every company at once? If yes, it is systematic (market) risk; if it is specific to one firm, it is unsystematic.",
      "chapter": "ch2", "objective": "lo2.2", "topics": ["diversification"], "termIds": ["t-ch2-003", "t-ch2-004"], "docAnchor": ""
    },
    {
      "id": "q-ch2-003", "type": "single",
      "stem": "Using the CAPM: the risk-free rate is 3%, the expected market return is 8%, and a stock's beta is 1.2. What is the stock's expected return?",
      "options": [
        { "text": "9.0%", "correct": true, "concept": "The CAPM adds beta times the market risk premium to the risk-free rate: `Rf + β × (Rm − Rf)`.", "explain": "Correct: 3% + 1.2 × (8% − 3%) = 9.0%." },
        { "text": "9.6%", "correct": false, "concept": "Multiplying beta by the total market return scales the whole return, risk-free part included.", "explain": "Incorrect: 1.2 × 8% skips subtracting the risk-free rate and adding it back." },
        { "text": "6.0%", "correct": false, "concept": "The market risk premium is the market return minus the risk-free rate.", "explain": "Not quite: 1.2 × 5% is only the risk premium; you forgot to add the 3% risk-free rate." },
        { "text": "8.0%", "correct": false, "concept": "An asset with a beta of exactly 1 is expected to earn the market return.", "explain": "Incorrect: a beta above 1 means an expected return above the market's 8%." }
      ],
      "explanation": "`E(R) = 3% + 1.2 × 5% = 9%`. Investors are compensated only for systematic risk (beta).",
      "chapter": "ch2", "objective": "lo2.2", "topics": ["CAPM"], "termIds": ["t-ch2-005"], "docAnchor": ""
    },
    {
      "id": "q-ch2-004", "type": "multi",
      "stem": "Which statements about **beta** are true?",
      "options": [
        { "text": "The market portfolio has a beta of 1.", "correct": true, "concept": "Beta is measured relative to the market itself.", "explain": "Correct: the market moves one-for-one with itself." },
        { "text": "A stock with a beta of 2 tends to move about twice as much as the market.", "correct": true, "concept": "Beta scales an asset's typical reaction to market moves.", "explain": "Correct: if the market rises 1%, a β = 2 stock tends to rise about 2%." },
        { "text": "Beta measures a stock's total risk.", "correct": false, "concept": "Total risk includes both market-wide and firm-specific parts; standard deviation measures it.", "explain": "Incorrect: beta captures only systematic risk; standard deviation measures total risk." },
        { "text": "A stock with a beta of 0 must be risk-free.", "correct": false, "concept": "A beta of 0 means returns don't move with the market.", "explain": "Incorrect: it has no systematic risk, but firm-specific events can still make its returns swing." }
      ],
      "explanation": "Beta = sensitivity to market moves (systematic risk only). Standard deviation = total risk.",
      "chapter": "ch2", "objective": "lo2.2", "topics": ["CAPM"], "termIds": ["t-ch2-005", "t-ch2-002"], "docAnchor": ""
    }
  ]
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;overflow-wrap:break-word}
h1,h2,h3{line-height:1.25;margin:0 0 .4em}
h1{font-size:1.6rem;font-weight:650}
h2{font-size:1.2rem;font-weight:650}
h3{font-size:1.05rem;font-weight:620}
p{margin:.4em 0}
a{color:var(--accent)}
code{font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;font-size:.92em;background:var(--surface-2);padding:.08em .35em;border-radius:5px;overflow-wrap:anywhere}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
[hidden]{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}
.muted{color:var(--muted)}.small{font-size:.875rem}.tiny{font-size:.78rem}
.topbar{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--border)}
.bar{display:flex;align-items:center;gap:8px;min-height:56px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 auto;background:none;border:0;color:var(--text);font:inherit;font-weight:650;cursor:pointer;padding:6px 4px;border-radius:8px;text-align:left}
.brand .logo{flex:none;width:28px;height:28px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:15px}
.brand-text{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{display:flex;gap:2px;flex:none}
.nav button,.icon-btn{background:none;border:0;color:var(--muted);font:inherit;font-size:.92rem;padding:8px 10px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.nav button:hover,.icon-btn:hover{background:var(--surface-2);color:var(--text)}
.nav button[aria-current="page"]{color:var(--text);background:var(--surface-2);font-weight:600}
.icon-btn svg,.nav svg{width:18px;height:18px}
main{padding:20px 16px 64px;outline:none}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.stack>*+*{margin-top:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font:inherit;font-size:.95rem;font-weight:560;padding:9px 14px;border-radius:10px;border:1px solid var(--border-strong);background:var(--surface);color:var(--text);cursor:pointer;text-decoration:none;line-height:1.2;min-height:40px}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-hover)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:.85rem;min-height:32px;border-radius:8px}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.5;cursor:not-allowed}
.btn svg{width:16px;height:16px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.spacer{flex:1}
.eyebrow{text-transform:uppercase;letter-spacing:.06em;font-size:.74rem;color:var(--muted);margin:0 0 4px;font-weight:600}
.hero-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}
.sbar{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--c-new);margin:14px 0 8px}
.sbar i{display:block;height:100%}
.st-mastered{background:var(--c-mastered)}.st-learning{background:var(--c-learning)}.st-missed{background:var(--c-missed)}.st-new{background:var(--c-new)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.84rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.ch-head{display:flex;align-items:flex-start;gap:8px}
.ch-head h3{flex:1;margin:4px 0 0}
.section-title{display:flex;align-items:center;gap:8px;margin:28px 0 12px}
.section-title h2{margin:0;flex:1}
.star-btn{background:none;border:0;padding:6px;border-radius:8px;cursor:pointer;color:var(--muted);display:inline-flex;flex:none}
.star-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linejoin:round}
.star-btn[aria-pressed="true"]{color:var(--star)}
.star-btn[aria-pressed="true"] svg{fill:var(--star)}
.star-btn.inherited svg{fill:var(--star);opacity:.45}
.star-btn:hover{background:var(--surface-2)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:.76rem;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.pill.st-mastered{background:var(--ok-soft);color:var(--ok)}
.pill.st-learning{background:var(--warn-soft);color:var(--warn)}
.pill.st-missed{background:var(--bad-soft);color:var(--bad)}

.opt[role=radio] .opt-key{border-radius:50%}
.opt[aria-checked="true"] .opt-key{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt-text{flex:1;padding-top:1px}
.opt-wrap.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.opt[aria-disabled="true"]{cursor:default}
.opt-wrap.is-correct{border-color:var(--ok);background:var(--ok-soft)}
.opt-wrap.is-wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt-wrap.is-missed{border-color:var(--ok);border-style:dashed}
.opt-fb{padding:0 14px 12px 52px;font-size:.92rem}
.opt-fb .verdict{font-weight:700;display:block;margin-bottom:2px}
.is-correct .verdict,.is-missed .verdict{color:var(--ok)}
.is-wrong .verdict{color:var(--bad)}
.is-neutral .verdict{color:var(--muted)}
.concept{padding:0 14px 12px 52px;font-size:.9rem;color:var(--muted)}
.concept b{color:var(--text);font-weight:600;font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;margin-right:4px}
.result-box{margin-top:16px;border-radius:12px;padding:14px 16px;border:1px solid var(--border)}
.result-box.ok{background:var(--ok-soft);border-color:transparent}
.result-box.bad{background:var(--bad-soft);border-color:transparent}
.result-box.soft{background:var(--warn-soft);border-color:transparent}
.result-box .big{font-weight:700;font-size:1.05rem}
.ok-t{color:var(--ok)}.bad-t{color:var(--bad)}.warn-t{color:var(--warn)}
.explain-box{margin-top:12px}
.related{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px;font-size:.88rem}
.chip-btn{font:inherit;font-size:.85rem;padding:3px 10px;border-radius:99px;border:1px solid var(--border-strong);background:var(--surface);color:var(--text);cursor:pointer}
.chip-btn:hover{background:var(--surface-2)}
.actionbar{position:sticky;bottom:0;z-index:15;background:var(--bg);border-top:1px solid var(--border);padding:10px 0 calc(10px + env(safe-area-inset-bottom));margin-top:16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.actionbar .grade-row{flex:1 1 100%}
.actionbar #btn-next{min-height:44px}
.bar-verdict{font-weight:700;font-size:1.02rem}
@media (hover:none){.kbd-hint,#g-flip small,.grade-row small{display:none}}
.kbd-hint{font-size:.78rem;color:var(--muted)}
kbd{font-family:ui-monospace,Consolas,monospace;font-size:.78em;border:1px solid var(--border-strong);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--surface)}
/* flashcards */
.fc-scene{perspective:1400px;margin:4px 0 14px}
.fc{display:grid;cursor:pointer;transition:transform var(--dur-flip) cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d;border-radius:var(--radius-lg);outline-offset:4px}
.fc.flipped{transform:rotateY(180deg)}
.fc-face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow);padding:28px 24px;min-height:230px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.fc-back{transform:rotateY(180deg)}
.fc-label{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:10px}
.fc-text{font-size:1.3rem;line-height:1.5;max-width:640px}
.fc-back .fc-text{font-size:1.1rem}
.grade-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.grade-row .btn{min-height:50px;flex-direction:column;gap:2px}
.grade-row .btn small{font-weight:400;color:var(--muted);font-size:.75rem}
.btn.g-miss{border-color:var(--bad);color:var(--bad)}
.btn.g-shaky{border-color:var(--warn);color:var(--warn)}
.btn.g-got{border-color:var(--ok);color:var(--ok)}
.type-row{display:flex;gap:8px;margin:0 0 12px}
.type-row input{flex:1}
@media (prefers-reduced-motion:reduce){
  :root{--dur-fast:0ms;--dur-flip:0ms}
  .tile:hover:not(:disabled){transform:none}
  .mtile,.mtile.matched{transition:none}
  .fc{transition:none;transform:none!important}
  .fc-back{transform:none}
  .fc .fc-back{visibility:hidden}.fc.flipped .fc-back{visibility:visible}.fc.flipped .fc-front{visibility:hidden}
  .toast{animation:none}.meter i{transition:none}
}
/* browse / lists */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:end;margin-bottom:14px}
.toolbar .grow{flex:1 1 220px}
.toolbar label{font-size:.78rem;font-weight:600;color:var(--muted);display:block}
.toolbar select{width:auto;min-width:120px}
.group{margin-top:18px}
.group-head{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:6px 0;border-bottom:1px solid var(--border);margin-bottom:6px}
.group-head h2{font-size:1.02rem;margin:0;flex:1 1 180px}
.item{border-bottom:1px solid var(--border)}
.item-top{display:flex;align-items:center;gap:6px}
.item-main{flex:1;min-width:0;display:flex;align-items:center;gap:10px;text-align:left;font:inherit;color:var(--text);background:none;border:0;padding:10px 4px;cursor:pointer;border-radius:8px}
.item-main:hover{background:var(--surface-2)}
.item-title{flex:1;min-width:0}
.item-def{color:var(--muted);font-size:.9rem;min-width:0;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;overflow:hidden}
.item-pills{display:inline-flex;align-items:center;gap:6px}

.item-body{padding:4px 8px 14px 12px;font-size:.93rem}
.item-body ol{padding-left:22px;margin:6px 0}
.item-body li{margin:4px 0}
.item-actions{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.elist{list-style:none;margin:0;padding:0}
.elist li{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)}
.el-main{flex:1 1 240px;min-width:0}
.tabs{display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid var(--border);margin-bottom:16px}
.tabs button{font:inherit;font-size:.92rem;background:none;border:0;border-bottom:2px solid transparent;padding:8px 10px;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--accent);font-weight:600}
.opt-edit{border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin-top:10px}
.oe-head{display:flex;align-items:center;gap:6px;flex-wrap:wrap}

.score-big{font-size:2.4rem;font-weight:700;line-height:1.1}

.lvl-error,.lvl-skipped{background:var(--bad-soft);color:var(--bad)}
.lvl-fixed{background:var(--warn-soft);color:var(--warn)}
.lvl-note{background:var(--surface-2);color:var(--muted)}

.miss-item{border-top:1px solid var(--border);padding:12px 0}
.miss-item:first-child{border-top:0}

dialog{border:0;padding:0;border-radius:16px;background:var(--surface);color:var(--text);width:min(680px,calc(100% - 24px));max-height:calc(100% - 24px);box-shadow:0 20px 60px rgba(0,0,0,.3)}

.dlg{display:flex;flex-direction:column;max-height:calc(100vh - 24px)}
.dlg-head{display:flex;align-items:center;gap:8px;padding:14px 16px 10px;border-bottom:1px solid var(--border)}
.dlg-head h2{flex:1;margin:0;font-size:1.1rem}
.dlg-body{padding:6px 16px 16px;overflow:auto}
.dlg-foot{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--border)}
.kbd-table td{padding:5px 8px;border-bottom:1px solid var(--border);font-size:.9rem}
@media (max-width:640px){

  .nav{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);gap:0;height:calc(58px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--surface);border-top:1px solid var(--border);z-index:30}

  #hero .fc-face{min-height:180px}

  .fc-face{min-height:200px;padding:22px 16px}
  .fc-text{font-size:1.15rem}

  .grade-row{gap:6px}
  .grade-row .btn{padding:8px 4px}
  .toolbar select{min-width:0;width:100%}
  .toolbar>div{flex:1 1 45%}
  .hide-sm{display:none}
}

function tsOf(v) { return typeof v === 'number' && isFinite(v) && v > 0 ? Math.floor(v) : 0; }   /* a timestamp in ms; anything else (missing, v1/v2 files) reads as 0 */
function normItem(r) {
  r = isObj(r) ? r : {};
  var n = function (v) { return typeof v === 'number' && isFinite(v) && v >= 0 ? Math.floor(v) : 0; };
  var o = Object.assign({}, r);
  o.seen = n(r.seen); o.right = n(r.right); o.wrong = n(r.wrong); o.streak = n(r.streak);
  o.last = (r.last === 'right' || r.last === 'wrong' || r.last === 'soft') ? r.last : null;
  o.lastAt = n(r.lastAt); o.starred = r.starred === true;
  o.missed = typeof r.missed === 'boolean' ? r.missed : (o.last === 'wrong');   /* older records had no flag */
  if (o.streak >= 2) o.missed = false;
  o.soft = n(r.soft); o.lapses = n(r.lapses);
  return o;
}
function normProgress(p) {
  p = isObj(p) ? p : {};
  var out = { schema: 1, items: {}, starredGroups: {}, sessions: [], groupStarAt: {}, resetAt: tsOf(p.resetAt) };
  if (isObj(p.items)) Object.keys(p.items).forEach(function (k) {
    out.items[k] = normItem(p.items[k]);
    var sa = isObj(p.items[k]) ? tsOf(p.items[k].starAt) : 0;
    if (sa) out.items[k].starAt = sa; else delete out.items[k].starAt;   /* sync field: when this item's star last changed */
    var ia = isObj(p.items[k]) ? tsOf(p.items[k].importAt) : 0;
    if (ia) out.items[k].importAt = ia; else delete out.items[k].importAt;   /* sync field: when Import progress (sync on) brought this record in */
  });
  if (isObj(p.starredGroups)) Object.keys(p.starredGroups).forEach(function (k) { if (p.starredGroups[k]) out.starredGroups[k] = true; });
  if (isObj(p.groupStarAt)) Object.keys(p.groupStarAt).forEach(function (k) { var t = tsOf(p.groupStarAt[k]); if (t) out.groupStarAt[k] = t; });
  if (Array.isArray(p.sessions)) out.sessions = p.sessions.filter(isObj).slice(-50);
  return out;
}
function loadProgress() { S.progress = normProgress(store.getJSON(progKey())); }
function saveProgress() { store.setJSON(progKey(), S.progress); }
function P(id) { return S.progress.items[id] || null; }
function ensureP(id) { if (!S.progress.items[id]) S.progress.items[id] = normItem({}); return S.progress.items[id]; }
function statusOf(id) {
  var p = P(id);
  if (!p || !p.seen) return 'new';
  if (p.missed) return 'missed';
  if (p.streak >= 2) return 'mastered';
  return 'learning';
}
function isStruggling(id) { var p = P(id); return !!p && (p.wrong >= 4 || p.lapses >= 2); }
/* outcome: 'right' | 'soft' | 'wrong'. Returns a snapshot so the outcome can be changed later
   (only OUTCOME_FIELDS are restored from it; a star toggled meanwhile is kept). */
var OUTCOME_FIELDS = ['seen', 'right', 'wrong', 'streak', 'last', 'lastAt', 'missed', 'soft', 'lapses'];
function applyOutcome(id, outcome) {
  var p = ensureP(id), snap = Object.assign({}, p);
  p.seen++;
  if (outcome === 'wrong') { if (p.streak >= 2 && !p.missed) p.lapses++; p.wrong++; p.streak = 0; p.missed = true; p.last = 'wrong'; }
  else if (outcome === 'right') { p.right++; p.streak++; p.last = 'right'; if (p.streak >= 2) p.missed = false; }
  else { p.right++; p.soft++; p.last = 'soft'; }
  p.lastAt = Date.now();
  saveProgress();
  return snap;
}
function itemStarredSelf(id) { var p = P(id); return !!(p && p.starred); }
function groupStarred(key) { return !!S.progress.starredGroups[key]; }
function inheritedStar(it) {
  if (it.chapter && groupStarred('chapter:' + it.chapter)) return 'its chapter';
  if (it.objective && groupStarred('objective:' + it.objective)) return 'its objective';
  for (var i = 0; i < (it.topics || []).length; i++) if (groupStarred('topic:' + it.topics[i])) return 'topic "' + it.topics[i] + '"';
  return '';
}
function isStarred(it) { return itemStarredSelf(it.id) || !!inheritedStar(it); }

/* ---------- progress merge (used by sync) ----------
   Pure: reads its two arguments, returns a new normalized progress object. Rules (PLAN-v3 section 4):
   1 resetAt = the later of the two; records, sessions and group stars stamped at or before it are dropped (only when resetAt > 0).
   2 per item: outcome fields from the record with the later lastAt (tie: more seen, then a fixed order of the record
     contents, so both devices pick the same one); star from the later starAt.
   3 per group key: the side with the later groupStarAt wins; starred only if the winner is starred.
   Star ties (equal stamps, including none at all as in v2 data): starred if either side is, since a missing stamp is not
   an unstar. Every tie is broken the same way whichever device merges, so devices never push back and forth.
   A record or session brought in by Import progress while sync is on carries importAt; it counts as touched at
   max(lastAt / at, importAt), so an import made after a reset survives that reset (see stampImport).
   4 sessions: union, dedupe by at+mode, sorted by time, last 50. */
function hasOwn(o, k) { return Object.prototype.hasOwnProperty.call(o, k); }
function stableStr(v) {   /* JSON with sorted keys, to compare two progress objects regardless of key order */
  if (Array.isArray(v)) return '[' + v.map(stableStr).join(',') + ']';
  if (isObj(v)) return '{' + Object.keys(v).sort().map(function (k) { return JSON.stringify(k) + ':' + stableStr(v[k]); }).join(',') + '}';
  return JSON.stringify(v);
}
function mergeProgress(local, remote) {
  var L = normProgress(clone(isObj(local) ? local : {})), R = normProgress(clone(isObj(remote) ? remote : {}));
  var resetAt = Math.max(L.resetAt, R.resetAt), out = normProgress({});
  out.resetAt = resetAt;
  var cut = function (t) { return resetAt > 0 && t <= resetAt; };   /* stamped at or before the latest reset */
  var blank = normItem({});
  var effAt = function (r) { return Math.max(r.lastAt || 0, r.importAt || 0); };
  var outKey = function (r) { var c = Object.assign({}, r); delete c.starred; delete c.starAt; return stableStr(c); };   /* last tie-break: same answer on every device */
  function scrub(rec) {   /* returns { rec, hit } with pre-reset parts removed */
    var r = Object.assign({}, rec), hit = false;
    if (cut(effAt(r))) { OUTCOME_FIELDS.forEach(function (f) { r[f] = blank[f]; }); delete r.importAt; hit = true; }
    if (cut(r.starAt || 0)) { if (r.starred || r.starAt) hit = true; r.starred = false; delete r.starAt; }
    return { rec: r, hit: hit };
  }
  var ids = Object.create(null);
  Object.keys(L.items).concat(Object.keys(R.items)).forEach(function (k) { ids[k] = 1; });
  Object.keys(ids).forEach(function (k) {
    var a = hasOwn(L.items, k) ? scrub(L.items[k]) : null, b = hasOwn(R.items, k) ? scrub(R.items[k]) : null;
    var ar = a && a.rec, br = b && b.rec, base, starRec, starOn;
    if (!ar || !br) { base = starRec = ar || br; starOn = starRec.starred === true; }
    else {
      var ea = effAt(ar), eb = effAt(br), sa = ar.starAt || 0, sb = br.starAt || 0;
      base = eb > ea || (eb === ea && (br.seen > ar.seen || (br.seen === ar.seen && outKey(br) > outKey(ar)))) ? br : ar;
      starRec = sb > sa ? br : ar;
      starOn = sa === sb ? (ar.starred === true || br.starred === true) : starRec.starred === true;
    }
    var o = Object.assign({}, base);
    o.starred = starOn;
    if (starRec.starAt) o.starAt = starRec.starAt; else delete o.starAt;
    var emptied = ((a && a.hit) || (b && b.hit)) && !o.seen && !o.lastAt && !o.starred && !o.starAt;
    if (!emptied) out.items[k] = o;
  });
  var gk = Object.create(null);
  [L, R].forEach(function (G) { Object.keys(G.starredGroups).concat(Object.keys(G.groupStarAt)).forEach(function (k) { gk[k] = 1; }); });
  Object.keys(gk).forEach(function (k) {
    function side(G) { var t = G.groupStarAt[k] || 0, on = !!G.starredGroups[k]; if (cut(t)) { t = 0; on = false; } return { t: t, on: on }; }
    var l = side(L), r = side(R), w = r.t > l.t ? r : l, on = w.on;
    if (l.t === r.t) on = l.on || r.on;   /* a tie (or neither side stamped, as in v2 data): absence is not an unstar, so a star is never lost */
    if (on) out.starredGroups[k] = true;
    if (w.t) out.groupStarAt[k] = w.t;
  });
  var seenS = Object.create(null), ss = [];
  L.sessions.concat(R.sessions).forEach(function (s) {
    var at = tsOf(s.at); if (cut(Math.max(at, tsOf(s.importAt)))) return;
    var key = at + '|' + s.mode + (at ? '' : '|' + s.right + '|' + s.total);
    if (seenS[key]) { if (stableStr(s) > stableStr(seenS[key].s)) { ss[seenS[key].i] = s; seenS[key].s = s; } return; }   /* duplicates: the same pick on every device */
    seenS[key] = { s: s, i: ss.length }; ss.push(s);
  });
  ss.sort(function (x, y) { return tsOf(x.at) - tsOf(y.at) || String(x.mode).localeCompare(String(y.mode)); });
  out.sessions = ss.slice(-50);
  return out;
}

/* ---------- deck index ---------- */
function rebuildIndex() {
  var NO = function () { return Object.create(null); };   /* no prototype: deep-link ids like "toString" must not match */
  var d = S.deck, idx = { chap: NO(), obj: NO(), term: NO(), q: NO(), topics: [] }, tp = NO();
  d.chapters.forEach(function (c) { idx.chap[c.id] = c; });
  d.objectives.forEach(function (o) { idx.obj[o.id] = o; });
  d.terms.forEach(function (t) { idx.term[t.id] = t; });
  d.questions.forEach(function (q) { idx.q[q.id] = q; });
  d.terms.concat(d.questions).forEach(function (it) { (it.topics || []).forEach(function (t) { tp[t] = (tp[t] || 0) + 1; }); });
  idx.topics = Object.keys(tp).sort(function (a, b) { return a.localeCompare(b); });
  S.idx = idx;
  document.title = plain(d.meta.title) + ' · Study';
}
function itemById(id) { return S.idx.term[id] || S.idx.q[id] || null; }
function kindOf(id) { return S.idx.term[id] ? 'term' : (S.idx.q[id] ? 'q' : null); }
function allItems() { return S.deck.terms.concat(S.deck.questions); }
function chTitle(id) { var c = S.idx.chap[id]; return c ? c.title : 'Unassigned'; }
function itemTitle(it) { return it.term != null ? it.term : it.stem; }
function hasConcepts(q) { return q.options.some(function (o) { return !!o.concept; }); }

/* ---------- doc links ---------- */
function resolveAnchor(a) {
  a = str(a);
  if (!a) return '';
  if (/^https?:\/\//i.test(a)) return a;
  if (a.charAt(0) === '#' && S.deck.meta.docUrl) return S.deck.meta.docUrl.split('#')[0] + a;
  return '';
}
/* item's own anchor; falls back to its objective's, then its chapter's */
function itemAnchor(it) {
  if (it.docAnchor && resolveAnchor(it.docAnchor)) return { url: resolveAnchor(it.docAnchor), label: 'Open in notes' };
  var lo = it.objective && S.idx.obj[it.objective];
  if (lo && resolveAnchor(lo.docAnchor)) return { url: resolveAnchor(lo.docAnchor), label: 'Objective notes' };
  var ch = it.chapter && S.idx.chap[it.chapter];
  if (ch && resolveAnchor(ch.docAnchor)) return { url: resolveAnchor(ch.docAnchor), label: 'Chapter notes' };
  return null;
}
function docLinkHtml(url, label) {
  if (!url) return '';
  return '<a class="doc-link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + ICON.doc + esc(label || 'Open in notes') + '</a>';
}
function itemDocLink(it) { var a = itemAnchor(it); return a ? docLinkHtml(a.url, a.label) : ''; }

/* =====================================================================
   Working copy (in-browser edits) and deck loading
   ===================================================================== */
function wcKey(id) { return LS + (id || S.fileId) + ':deck'; }
function deckStr(d) { return JSON.stringify(d); }
function setDeck(deck, report) {
  var oldId = S.deck && S.deck.meta.id;
  S.deck = deck; S.report = report && report.warnings && report.warnings.length ? report : null; S.reportDismissed = false;
  rebuildIndex();
  if (oldId !== deck.meta.id || !S.progress) loadProgress();
}
function saveWorkingCopy() {
  if (S.embeddedDeck && deckStr(S.deck) === deckStr(S.embeddedDeck)) { store.del(wcKey()); S.wc = null; return; }
  S.wc = { schema: 1, base: S.embeddedHash, deck: S.deck, modifiedAt: Date.now(), savedAt: 0, savedName: '' };
  store.setJSON(wcKey(), S.wc);
}
function commitDeck(deck, msg) {
  var r = validateDeck(clone(deck));
  if (r.fatal) { toast('Could not apply: ' + r.errors[0].msg); return false; }
  setDeck(r.deck, r);
  saveWorkingCopy();
  if (msg) toast(msg);
  render();
  return true;
}
function loadInitialDeck() {
  var el = document.getElementById('deck-data');
  var text = el ? el.textContent : '';
  var parsed = parseDeckText(text, false), rep;
  if (parsed.ok) { rep = validateDeck(parsed.value); }
  else { rep = { fatal: true, errors: [{ level: 'error', path: 'JSON', msg: 'The deck JSON could not be read: ' + parsed.error.msg + (parsed.error.line ? ' (line ' + parsed.error.line + ', column ' + parsed.error.col + ')' : ''), snippet: parsed.error.snippet }], warnings: [] }; }
  if (parsed.ok && parsed.notes.length) parsed.notes.forEach(function (n) { rep.warnings.unshift({ level: 'fixed', path: 'JSON', msg: n }); });
  if (rep.fatal) {
    S.fileId = '_invalid-' + hashStr(text); S.embeddedHash = hashStr(text); S.embeddedError = rep;
  } else {
    S.embeddedDeck = rep.deck; S.fileId = rep.deck.meta.id; S.embeddedHash = hashStr(deckStr(rep.deck));
  }
  var wc = store.getJSON(wcKey());
  if (wc && isObj(wc) && wc.deck) {
    var wr = validateDeck(wc.deck);
    if (!wr.fatal) {
      if (S.embeddedDeck && deckStr(wr.deck) === deckStr(S.embeddedDeck)) { store.del(wcKey()); }
      else if (wc.base === S.embeddedHash) { S.wc = wc; setDeck(wr.deck, wr); return; }
      else { S.staleWc = wc; }
    }
  }
  if (rep.fatal) { S.view = 'report'; return; }
  setDeck(rep.deck, rep);
}
function blankDeck(title, course, id) {
  return { schema: 1, meta: { id: id || ('deck-' + Date.now().toString(36)), title: title || 'Untitled deck', course: course || '', updated: todayISO(), docUrl: '' }, chapters: [], objectives: [], terms: [], questions: [] };
}

/* =====================================================================
   Save as HTML (the file reproduces itself from its own source parts)
   ===================================================================== */
function deckJson(deck) {
  return JSON.stringify(deck, null, 2).replace(/<\//g, '<\\/').replace(new RegExp('<' + '!--', 'g'), '\\u003c!--');
}
function buildHtml(deck) {
  var css = document.getElementById('app-style').textContent;
  var js = document.getElementById('app-code').textContent;
  var C1 = '<' + '!--', C2 = '--' + '>', SC = '<' + '/script>';
  return '<!DOCTYPE html>\n<html lang="en">\n<head>\n<meta charset="utf-8">\n' +
    '<meta name="viewport" content="width=device-width, initial-scale=1">\n<meta name="color-scheme" content="light dark">\n' +
    '<title>' + esc(plain(deck.meta.title)) + '</title>\n' +
    C1 + ' ====================== DECK DATA (START) ======================\n' +
    '  This is the ONLY part of the file that changes between classes.\n' +
    '  Replace the JSON inside the deck-data script tag below with a new\n' +
    '  deck (format: SPEC.md section 1; generate it with DECK_PROMPT.md).\n' +
    '  Inside JSON strings, write the two characters  </  as  <\\/\n' +
    '  Everything after DECK DATA (END) is the app: leave it unchanged.\n' +
    '  ================================================================ ' + C2 + '\n' +
    '<script type="application/json" id="deck-data">\n' + deckJson(deck) + '\n' + SC + '\n' +
    C1 + ' ======================= DECK DATA (END) ======================= ' + C2 + '\n' +
    '<style id="app-style">' + css + '</' + 'style>\n</head>\n<body>\n' +
    '<div id="app"><noscript><p style="padding:24px;font:16px system-ui">This study tool needs JavaScript. Please enable it and reload.</p></noscript></div>\n' +
    '<script id="app-code">' + js + SC + '\n</body>\n</html>\n';
}
function download(name, text, type) {
  var blob = new Blob([text], { type: type || 'application/octet-stream' });
  var url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = name; a.style.display = 'none';
  document.body.appendChild(a); a.click();
  setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 4000);
}
function saveAsHtml() {
  var name = (slug(S.deck.meta.id) || 'study-tool') + '.html';
  download(name, buildHtml(S.deck), 'text/html');
  if (S.wc) { S.wc.savedAt = Date.now(); S.wc.savedName = name; store.setJSON(wcKey(), S.wc); }
  toast('Downloaded ' + name + '. Open that file to keep studying with these changes.');
  renderBanners();
}

/* =====================================================================
   UI helpers: toast, modal, copy
   ===================================================================== */
function toast(msg) {
  var box = $('#toasts'); if (!box) return;
  var t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  box.appendChild(t);
  setTimeout(function () { t.remove(); }, 4200);
}
function openModal(title, body, foot, onClose) {
  var dlg = $('#modal');
  dlg.innerHTML = '<div class="dlg"><div class="dlg-head"><h2 id="modal-title">' + esc(title) + '</h2><button class="icon-btn" data-action="modal-close" aria-label="Close dialog">✕</button></div>' +
    '<div class="dlg-body">' + body + '</div>' + (foot ? '<div class="dlg-foot">' + foot + '</div>' : '') + '</div>';
  dlg.setAttribute('aria-labelledby', 'modal-title');
  S.modalOnClose = onClose || null;
  if (!dlg.open) { try { dlg.showModal(); } catch (e) { dlg.setAttribute('open', ''); } }
  var f = $('[autofocus]', dlg) || $('input,textarea,select', dlg);
  if (f) f.focus();
}
function closeModal() { var dlg = $('#modal'); if (dlg.open) dlg.close(); }
var confirmCb = null;
function confirmBox(title, msgHtml, okLabel, cb, danger) {
  confirmCb = cb;
  openModal(title, '<p>' + msgHtml + '</p>', '<button class="btn" data-action="modal-close">Cancel</button><button class="btn ' + (danger ? 'danger' : 'primary') + '" data-action="confirm-ok" id="confirm-ok" autofocus>' + esc(okLabel) + '</button>');
}
function copyText(text, what) {
  function fallback() {
    var ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    ta.remove();
    if (ok) toast((what || 'Text') + ' copied.');
    else openModal('Copy ' + (what || 'text'), '<p>Copy this manually:</p><input type="text" readonly value="' + esc(text) + '" onfocus="this.select()" autofocus>', '<button class="btn primary" data-action="modal-close">Done</button>');
  }
  try {
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(function () { toast((what || 'Text') + ' copied.'); }, fallback);
    else fallback();
  } catch (e) { fallback(); }
}
function baseUrl() { return location.href.split('#')[0]; }
function readFileText(file, cb) { var r = new FileReader(); r.onload = function () { cb(String(r.result || '')); }; r.onerror = function () { toast('Could not read that file.'); }; r.readAsText(file); }

/* ---------- small render helpers ---------- */
var ST_LABEL = { mastered: 'Mastered', learning: 'Learning', missed: 'Missed', new: 'New' };
var ST_ICON = { mastered: '✓', learning: '◐', missed: '✗', new: '○' };
function pill(st) { return '<span class="pill st-' + st + '">' + ST_ICON[st] + ' ' + ST_LABEL[st] + '</span>'; }
function counts(items) { var c = { mastered: 0, learning: 0, missed: 0, new: 0 }; items.forEach(function (it) { c[statusOf(it.id)]++; }); return c; }
function stackBar(c) {
  var tot = c.mastered + c.learning + c.missed + c.new;
  var label = c.mastered + ' mastered, ' + c.learning + ' learning, ' + c.missed + ' missed, ' + c.new + ' new';
  if (!tot) return '<div class="sbar" role="img" aria-label="No items"></div>';
  return '<div class="sbar" role="img" aria-label="' + label + '">' + ['mastered', 'learning', 'missed'].map(function (k) { return c[k] ? '<i class="st-' + k + '" style="width:' + (100 * c[k] / tot) + '%"></i>' : ''; }).join('') + '</div>';
}
function legendHtml(c) { return '<div class="legend">' + ['mastered', 'learning', 'missed', 'new'].map(function (k) { return '<span><i class="sw st-' + k + '"></i>' + c[k] + ' ' + k + '</span>'; }).join('') + '</div>'; }
function starItemBtn(it) {
  var self = itemStarredSelf(it.id), inh = inheritedStar(it), name = short(itemTitle(it), 40);
  return '<button class="star-btn' + (!self && inh ? ' inherited' : '') + '" data-action="star-item" data-id="' + esc(it.id) + '" aria-pressed="' + self + '" aria-label="Star ' + esc(name) + '" title="' + (self ? 'Starred' : inh ? 'Starred via ' + esc(inh) : 'Star this item') + '">' + ICON.star + '</button>';
}
function starGroupBtn(key, name) {
  var on = groupStarred(key);
  return '<button class="star-btn" data-action="star-group" data-key="' + esc(key) + '" aria-pressed="' + on + '" aria-label="Star all of ' + esc(name) + '" title="' + (on ? 'Unstar group' : 'Star every item in this group') + '">' + ICON.star + '</button>';
}

/* =====================================================================
   Rendering
   ===================================================================== */
function buildShell() {
  document.getElementById('app').innerHTML =
    '<header class="topbar"><div class="wrap bar">' +
    '<button class="brand" data-action="nav" data-view="dashboard" aria-label="Home"><span class="logo" aria-hidden="true">◆</span><span class="brand-text" id="brand-text"></span></button>' +
    '<nav class="nav" aria-label="Main" id="nav"></nav>' +
    '<button class="icon-btn" data-action="settings" aria-label="Settings" title="Settings">' + ICON.gear + '</button>' +
    '<button class="icon-btn" data-action="theme" id="theme-btn" aria-label="Theme" title="Theme">' + ICON.theme + '</button>' +
    '<button class="icon-btn hide-sm" data-action="help" aria-label="Keyboard shortcuts and help" title="Help (?)">' + ICON.help + '</button>' +
    '</div></header>' +
    '<div class="wrap" id="banners"></div>' +
    '<main id="main" class="wrap" tabindex="-1"></main>' +

function announce(msg) { var a = $('#announce'); if (a) { a.textContent = ''; setTimeout(function () { a.textContent = msg; }, 30); } }

function onKey(e) {
