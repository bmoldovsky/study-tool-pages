<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-title" content="UnChalked">
<meta name="studytool-launcher" content="1">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f5f4ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131518" media="(prefers-color-scheme: dark)">
<title>UnChalked</title>
<style>
:root{
  --bg:#f5f4ef;--surface:#fff;--surface-2:#efeee8;--border:#e0ded5;--text:#1d2126;--muted:#5d646d;
  --accent:#2a6685;--accent-ink:#fff;--accent-soft:#e2edf3;--ok:#23704a;--ok-soft:#e1f1e7;--warn:#8a5d00;--warn-soft:#fbf0d6;--bad:#b13e30;--bad-soft:#f8e4e0;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(30,30,20,.06);color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#131518;--surface:#1c1f23;--surface-2:#24282d;--border:#2f343a;--text:#e4e5e2;--muted:#9ba2aa;
  --accent:#6fb0d2;--accent-ink:#0d1a21;--accent-soft:#1d3240;--ok:#6cc596;--ok-soft:#173326;--warn:#e7bf64;--warn-soft:#352a10;--bad:#ee8a7a;--bad-soft:#3a1e1a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#131518;--surface:#1c1f23;--surface-2:#24282d;--border:#2f343a;--text:#e4e5e2;--muted:#9ba2aa;
  --accent:#6fb0d2;--accent-ink:#0d1a21;--accent-soft:#1d3240;--ok:#6cc596;--ok-soft:#173326;--warn:#e7bf64;--warn-soft:#352a10;--bad:#ee8a7a;--bad-soft:#3a1e1a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;overflow-wrap:break-word}
.wrap{max-width:720px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) calc(32px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.logo{flex:none;width:40px;height:40px;border-radius:10px;object-fit:cover;background:#111}
.top .t{flex:1;min-width:0}
h1{font-size:1.45rem;line-height:1.2;margin:0}
.muted{color:var(--muted)}.small{font-size:.875rem}.tiny{font-size:.78rem}
#status{margin:2px 0 0}
.btn{flex:none;font:inherit;font-size:.9rem;font-weight:560;padding:8px 12px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad)}
.btn.sm{font-size:.82rem;padding:5px 10px}
.btn:disabled{opacity:.6;cursor:default}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.syncbar{display:flex;align-items:center;gap:10px;margin:0 0 16px;padding:8px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--border);font-size:.86rem}
.syncbar .dot{flex:none;width:9px;height:9px;border-radius:50%;background:var(--muted)}
.syncbar.on .dot{background:var(--ok)}
.syncbar.err .dot{background:var(--warn)}
.syncbar .txt{flex:1;min-width:0;color:var(--muted)}
.syncbar .txt b{color:var(--text);font-weight:600}
.list{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.item{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.card{display:block;text-decoration:none;color:inherit;padding:14px 16px 10px}
.card:active{background:var(--surface-2)}
.acts{display:flex;flex-wrap:wrap;gap:8px;padding:0 16px 12px}
.btn.upd{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pill.shared{background:var(--surface-2);color:var(--text)}
.course{font-size:.75rem;font-weight:650;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:0 0 2px}
.card h2{font-size:1.08rem;line-height:1.3;margin:0 0 6px;color:var(--text)}
.counts{margin:0 0 8px;font-size:.88rem;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.pill{display:inline-flex;align-items:center;font-size:.76rem;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.ver{background:var(--accent-soft);color:var(--accent)}
.pill.done{background:var(--ok-soft);color:var(--ok)}
.pill.new{background:var(--warn-soft);color:var(--warn)}
.file{margin:8px 0 0;font-size:.76rem;color:var(--muted);font-family:ui-monospace,SFMono-Regular,Consolas,monospace;overflow-wrap:anywhere}
.add{display:flex;width:100%;align-items:center;gap:12px;text-align:left;font:inherit;cursor:pointer;background:none;color:var(--accent);border:1.5px dashed var(--border);border-radius:14px;padding:14px 16px;font-weight:600;margin-top:12px}
.add .plus{flex:none;width:32px;height:32px;border-radius:9px;background:var(--accent-soft);display:grid;place-items:center;font-size:1.3rem;line-height:1}
.add small{display:block;font-weight:400;color:var(--muted);font-size:.8rem;margin-top:2px}
.note{background:var(--surface);border:1px dashed var(--border);border-radius:14px;padding:14px 16px;margin:0}
footer{margin-top:22px}
footer a,.dlg a{color:var(--accent)}
dialog{border:0;padding:0;border-radius:16px;background:var(--surface);color:var(--text);width:min(600px,calc(100% - 24px));max-height:calc(100% - 24px);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(10,12,14,.5)}
.dlg{display:flex;flex-direction:column;max-height:calc(100vh - 24px)}
.dlg-head{display:flex;align-items:center;gap:8px;padding:14px 16px 10px;border-bottom:1px solid var(--border)}
.dlg-head h2{flex:1;margin:0;font-size:1.1rem}
.x{background:none;border:0;font:inherit;font-size:1.1rem;color:var(--muted);cursor:pointer;padding:6px 8px;border-radius:8px}
.dlg-body{padding:12px 16px 16px;overflow:auto}
.dlg-body p{margin:.5em 0}
.dlg-body ol{padding-left:1.2em;margin:.5em 0}
.dlg-body li{margin:.25em 0}
.dlg-foot{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--border)}
label.f{display:block;font-weight:600;font-size:.88rem;margin:10px 0 4px}
input[type=text],input[type=password],textarea{width:100%;font:inherit;font-size:.92rem;padding:9px 11px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text)}
textarea{min-height:150px;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:.8rem}
.seg{display:flex;gap:6px;margin:4px 0 8px}
.seg button[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.msg{border-radius:10px;padding:10px 12px;margin:10px 0 0;font-size:.88rem}
.msg.ok{background:var(--ok-soft);color:var(--ok)}
.msg.bad{background:var(--bad-soft);color:var(--bad)}
.msg.warn{background:var(--warn-soft);color:var(--warn)}
.msg ul{margin:4px 0 0;padding-left:1.2em}
.choice{display:flex;gap:8px;align-items:flex-start;margin:6px 0;font-size:.9rem}
.choice input{margin-top:4px}
.choice small{display:block;color:var(--muted)}
.summary{background:var(--surface-2);border-radius:10px;padding:10px 12px;margin:10px 0 0;font-size:.88rem}
.summary b{display:block;font-size:.98rem}
</style>
</head>
<body>
<main class="wrap">
  <header class="top">
    <img class="logo" src="icon-192.png" alt="" width="40" height="40">
    <div class="t">
      <h1>UnChalked</h1>
      <p id="status" class="muted small" role="status">Loading…</p>
    </div>
    <button type="button" class="btn" id="refresh">Refresh</button>
  </header>
  <div class="syncbar" id="syncbar"><span class="dot" aria-hidden="true"></span><span class="txt" id="sync-txt"></span><button type="button" class="btn sm" id="sync-btn">Set up</button></div>
  <ul class="list" id="list"></ul>
  <p class="note small muted" id="empty" hidden></p>
  <button type="button" class="add" id="add-deck"><span class="plus" aria-hidden="true">+</span><span>Add a deck<small>Paste the deck JSON an AI made, or choose a saved .html file. It goes live here in about a minute.</small></span></button>
  <footer class="tiny muted">
    <p>Any HTML file in the repo shows up here (files starting with “_” are hidden). <a id="repo-link" href="#">Open the repo on GitHub</a></p>
    <p>Ideas or problems? <a id="feedback-link" href="#">✉ Send feedback</a></p>
  </footer>
</main>

<dialog id="dlg-token" aria-labelledby="tok-h"><div class="dlg">
  <div class="dlg-head"><h2 id="tok-h">GitHub token</h2><button type="button" class="x" data-close aria-label="Close">✕</button></div>
  <div class="dlg-body" id="tok-body"></div>
  <div class="dlg-foot" id="tok-foot"></div>
</div></dialog>

<dialog id="dlg-add" aria-labelledby="add-h"><div class="dlg">
  <div class="dlg-head"><h2 id="add-h">Add a deck</h2><button type="button" class="x" data-close aria-label="Close">✕</button></div>
  <div class="dlg-body" id="add-body"></div>
  <div class="dlg-foot" id="add-foot"></div>
</div></dialog>

<script>
(function () {
  'use strict';
  var CACHE = 'launcher:v1', SYNC = 'studytool:sync', DEFAULT_REPO = 'bmoldovsky/study-tool-pages', GH = 'https://api.github.com';
  var GIST_DESC = 'Study Tool progress sync (managed by the app)', GIST_META = 'studytool-sync.json';   /* same names the app uses, so every version finds the same Gist */
  var $ = function (id) { return document.getElementById(id); };
  var LOCAL_OK = /^http:\/\/(localhost|127\.0\.0\.1)(:\d+)?\//i;   /* plain-http links allowed only for local testing */

  function repoName() {
    var q = new URLSearchParams(location.search).get('repo');
    if (q && /^[\w.-]+\/[\w.-]+$/.test(q)) return q;
    var h = location.hostname;
    if (/\.github\.io$/i.test(h)) {
      var owner = h.split('.')[0], seg = location.pathname.split('/').filter(Boolean)[0];
      return seg && !/\.html?$/i.test(seg) ? owner + '/' + seg : owner + '/' + h;
    }
    return DEFAULT_REPO;
  }
  var REPO = repoName(), BRANCH = 'main';
  $('repo-link').href = 'https://github.com/' + REPO;
  /* feedback address assembled at run time so it never sits in the file as plain text for scrapers */
  $('feedback-link').href = 'mailto:' + ['UnChalked.help', 'gmail.com'].join('@') + '?subject=' + encodeURIComponent('UnChalked suggestion') + '&body=' + encodeURIComponent('\n\n\n(For context, please keep this:)\nFrom: the UnChalked launcher');
  /* lets every study file on this site show a "‹ Decks" button back to this page */
  try { localStorage.setItem('studytool:launcher', location.href.split('#')[0].split('?')[0]); } catch (e) {}

  function load() { try { var c = JSON.parse(localStorage.getItem(CACHE)); return c && c.files ? c : null; } catch (e) { return null; } }
  function save(c) { try { localStorage.setItem(CACHE, JSON.stringify(c)); } catch (e) {} }
  function syncCfg() { try { var c = JSON.parse(localStorage.getItem(SYNC)); return c && typeof c.token === 'string' && c.token ? c : null; } catch (e) { return null; } }
  function progressOf(id) {
    var out = { answers: 0, last: 0, mastered: 0 };
    try {
      var p = JSON.parse(localStorage.getItem('studytool:' + id + ':progress'));
      var items = p && p.items ? p.items : {};
      Object.keys(items).forEach(function (k) {
        var r = items[k] || {};
        out.answers += +r.seen || 0;
        if ((+r.lastAt || 0) > out.last) out.last = +r.lastAt;
        if ((+r.streak || 0) >= 2) out.mastered++;
      });
    } catch (e) {}
    return out;
  }
  function ago(t) {
    var s = (Date.now() - t) / 1000;
    if (s < 90) return 'just now';
    if (s < 3600) return Math.round(s / 60) + ' min ago';
    if (s < 86400) return Math.round(s / 3600) + ' h ago';
    var d = Math.round(s / 86400);
    return d === 1 ? 'yesterday' : d < 30 ? d + ' days ago' : new Date(t).toLocaleDateString();
  }
  function plain(s) { return String(s == null ? '' : s).replace(/\*\*|`/g, '').replace(/(^|\s)\*(\S[^*]*?)\*/g, '$1$2'); }
  function plural(n, w) { return n + ' ' + w + (n === 1 ? '' : 's'); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function hash(s) { var h = 0x811c9dc5; for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193); } return (h >>> 0).toString(16); }
  function vnum(v) { var p = String(v || '0').split('.'); return (+p[0] || 0) * 1000 + (+p[1] || 0); }

  var DECK_RE = /(<script type="application\/json" id="deck-data">)([\s\S]*?)(<\/script>)/;
  function deckOf(text) { var m = DECK_RE.exec(text); if (!m) return null; try { return JSON.parse(m[2]); } catch (e) { return null; } }
  function parse(name, text) {
    var v = text.match(/var VERSION = '([^']+)'/);
    var t = text.match(/<title>([^<]*)<\/title>/);
    var info = { title: t ? t[1].trim() : name, version: v ? v[1] : '' };
    var d = deckOf(text);
    if (!d) { info.other = true; return info; }
    var meta = d.meta || {};
    info.id = meta.id || ''; info.title = plain(meta.title) || info.title; info.course = plain(meta.course);
    info.updated = meta.updated || ''; info.mastery = meta.mastery || '';
    ['chapters', 'objectives', 'terms', 'questions'].forEach(function (k) { info[k] = Array.isArray(d[k]) ? d[k].length : 0; });
    var sf = meta.sharedFrom;
    if (sf && typeof sf.url === 'string' && (/^https:\/\//.test(sf.url) || LOCAL_OK.test(sf.url))) info.sharedFrom = { url: sf.url, deckHash: String(sf.deckHash || '') };
    return info;
  }
  /* a deck's fingerprint, ignoring where it was shared from, so a copy can tell when its source changed */
  function deckHash(d) { var x = JSON.parse(JSON.stringify(d)); if (x.meta) delete x.meta.sharedFrom; return hash(JSON.stringify(x)); }
  function ownerOf(url) { try { var h = new URL(url).hostname; return /\.github\.io$/i.test(h) ? h.split('.')[0] : h; } catch (e) { return ''; } }

  /* ---------- shared decks: update checks (state kept in this browser only) ---------- */
  var SHARED = 'launcher:shared';
  function sharedState() { try { return JSON.parse(localStorage.getItem(SHARED)) || {}; } catch (e) { return {}; } }
  function saveShared(s) { try { localStorage.setItem(SHARED, JSON.stringify(s)); } catch (e) {} }
  function updateFor(info) { var s = info.sharedFrom && sharedState()[info.sharedFrom.url]; return !!(s && s.deckHash && info.sharedFrom.deckHash && s.deckHash !== info.sharedFrom.deckHash); }
  function sourceGone(info) { var s = info.sharedFrom && sharedState()[info.sharedFrom.url]; return !!(s && s.missing); }
  function checkUpdates(force) {
    var c = load(); if (!c) return;
    var urls = {};
    c.files.forEach(function (f) { var i = (c.decks[f.name] || {}).info; if (i && i.sharedFrom) urls[i.sharedFrom.url] = 1; });
    Object.keys(urls).forEach(function (u) {
      var s = sharedState()[u] || {};
      if (!force && s.checkedAt && Date.now() - s.checkedAt < 6 * 3600e3) return;   /* at most every 6 hours unless Refresh is tapped */
      var done = function (patch) { var all = sharedState(); all[u] = Object.assign({}, all[u] || {}, patch, { checkedAt: Date.now() }); saveShared(all); render(load()); };
      fetch(u, { method: 'HEAD', cache: 'no-store' }).then(function (r) {
        if (!r.ok) { done({ missing: r.status === 404 }); return; }
        var lm = r.headers.get('Last-Modified') || '';
        if (lm && lm === s.lastModified && s.deckHash) { done({ missing: false }); return; }   /* unchanged since the last look */
        return fetch(u, { cache: 'no-store' }).then(function (r2) { return r2.ok ? r2.text() : ''; }).then(function (t) {
          var d = t && deckOf(t); if (d) done({ deckHash: deckHash(d), lastModified: lm, missing: false });
        });
      }).catch(function () {});
    });
  }

  /* ---------- share ---------- */
  function shareText(title) { return 'Here’s my UnChalked deck “' + title + '”. To add it: open your UnChalked launcher → Add a deck → From a link, and paste this link.'; }
  function copy(text) {
    if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text).then(function () { return true; }, function () { return false; });
    var ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select();
    var ok = false; try { ok = document.execCommand('copy'); } catch (e) {} ta.remove(); return Promise.resolve(ok);
  }
  function shareDeck(name, title) {
    var url = new URL(encodeURI(name), location.href).href;
    if (navigator.share) { navigator.share({ title: title, text: shareText(title), url: url }).catch(function () {}); return; }
    copy(shareText(title) + '\n' + url).then(function (ok) { $('status').textContent = ok ? 'Link copied. Paste it to your friend.' : 'Copy this link: ' + url; });
  }

  /* ---------- deck list ---------- */
  var pending = {};   /* file name -> hash of the text just published; the card says "Publishing…" until the site serves it */
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function render(c, msg) {
    var list = $('list'); list.textContent = '';
    if (msg != null) $('status').textContent = msg;
    var rows = (c ? c.files : []).map(function (f) {
      var info = (c.decks[f.name] || {}).info || { title: f.name, other: true };
      return { f: f, info: info, p: info.id ? progressOf(info.id) : { answers: 0, last: 0, mastered: 0 } };
    });
    rows.sort(function (a, b) { return (b.p.last - a.p.last) || String(a.info.course || '').localeCompare(b.info.course || '') || String(a.info.title).localeCompare(b.info.title) || a.f.name.localeCompare(b.f.name); });
    rows.forEach(function (r) {
      var i = r.info, li = el('li', 'item'), a = el('a', 'card');
      a.href = encodeURI(r.f.name);
      if (i.course) a.appendChild(el('p', 'course', i.course));
      a.appendChild(el('h2', '', i.title));
      if (!i.other) {
        var parts = [];
        if (i.chapters) parts.push(plural(i.chapters, 'chapter'));
        if (i.terms) parts.push(plural(i.terms, 'term'));
        if (i.questions) parts.push(plural(i.questions, 'question'));
        if (parts.length) a.appendChild(el('p', 'counts', parts.join(' · ')));
      }
      var row = el('div', 'row');
      if (pending[r.f.name]) row.appendChild(el('span', 'pill new', 'Publishing… about a minute'));
      if (i.version) row.appendChild(el('span', 'pill ver', 'App v' + i.version));
      if (r.p.last) row.appendChild(el('span', 'pill done', 'Studied ' + ago(r.p.last) + ' · ' + plural(r.p.answers, 'answer')));
      else if (!i.other) row.appendChild(el('span', 'pill new', 'Not studied in this browser'));
      if (i.updated) row.appendChild(el('span', 'pill', 'Deck updated ' + i.updated));
      if (i.sharedFrom) row.appendChild(el('span', 'pill shared', sourceGone(i) ? 'Shared deck · source removed' : 'Shared by ' + ownerOf(i.sharedFrom.url)));
      if (row.childNodes.length) a.appendChild(row);
      a.appendChild(el('p', 'file', r.f.name));
      li.appendChild(a);
      if (!i.other) {
        var acts = el('div', 'acts');
        if (i.sharedFrom && updateFor(i)) {
          var up = el('button', 'btn sm upd', 'Update available'); up.type = 'button';
          up.onclick = function () { openAdd({ link: i.sharedFrom.url, target: r.f.name }); };
          acts.appendChild(up);
        }
        var sh = el('button', 'btn sm', 'Share with friends'); sh.type = 'button'; sh.setAttribute('aria-label', 'Share ' + i.title + ' with friends');
        sh.onclick = function () { shareDeck(r.f.name, i.title); };
        acts.appendChild(sh); li.appendChild(acts);
      }
      list.appendChild(li);
    });
    var empty = $('empty');
    empty.hidden = rows.length > 0;
    if (!rows.length) empty.textContent = c ? 'No study files in the repo yet. Tap Add a deck below.' : 'Couldn’t load the list yet. Check your connection and tap Refresh.';
  }

  var busy = false;
  function listContents(useToken) {
    var cfg = useToken ? syncCfg() : null, h = { Accept: 'application/vnd.github+json' };
    if (cfg) h.Authorization = 'Bearer ' + cfg.token;
    return fetch(GH + '/repos/' + REPO + '/contents/', { headers: h, cache: 'no-store' }).then(function (res) {
      if (cfg && (res.status === 401 || res.status === 403 || res.status === 404)) return listContents(false);   /* a bad, expired or too-narrow token never blocks the list */
      if (!res.ok) throw new Error(res.status === 403 || res.status === 429 ? 'busy' : 'http ' + res.status);
      return res.json();
    });
  }
  function refresh(force) {
    if (busy) return Promise.resolve(); busy = true; $('refresh').disabled = true;
    var c = load() || { files: [], decks: {}, at: 0 };
    $('status').textContent = 'Checking for new files…';
    return listContents(true)
      .then(function (items) {

    var taken = {}; (load() || { files: [] }).files.forEach(function (f) { taken[f.name.toLowerCase()] = 1; });
    for (var k = 2, base = A.plan.name.replace(/\.html?$/i, ''); taken[A.plan.name.toLowerCase()] && k < 50; k++) A.plan.name = base + '-' + k + '.html';   /* "separate file" never collides by default */
    if (A.plan.isUpdate && A.plan.srcHash && linked[0].info.sharedFrom && linked[0].info.sharedFrom.deckHash === A.plan.srcHash) {
      msg('add-msg', 'ok', 'Your copy (' + esc(target) + ') already matches the shared deck. Nothing to update.');
      var all = sharedState(); all[A.linkUrl] = Object.assign({}, all[A.linkUrl] || {}, { deckHash: A.plan.srcHash, checkedAt: Date.now() }); saveShared(all); render(load());
      showPlanButton(false); return;
    }
    renderPlan(); showPlanButton(true);
  }
  function renderPlan() {
    var P = A.plan, d = P.deck, h = '<div class="summary"><b>' + esc(plain(d.meta.title)) + '</b>' + esc(plain(d.meta.course || '')) +
      '<br>' + esc([plural((d.chapters || []).length, 'chapter'), plural((d.terms || []).length, 'term'), plural((d.questions || []).length, 'question')].join(' · ')) + ' · deck ID <code>' + esc(d.meta.id) + '</code>' +
      (A.src === 'link' ? '<br>Shared by <b>' + esc(ownerOf(A.linkUrl)) + '</b>' : '') + '</div>';
    if (P.isUpdate) {
      h += '<p class="small" style="margin-top:12px">Updates your copy, <b>' + esc(P.target) + '</b>, to your friend’s latest version. Your progress stays (it is saved by deck ID). Any edits you made to your copy are replaced.</p>';
    } else if (P.same.length) {
      h += '<p class="small" style="margin-top:12px">A deck with this ID is already on your site: <b>' + esc(P.same.map(function (x) { return x.name; }).join(', ')) + '</b>. Progress is saved by deck ID, so it is shared between them.</p>';
      if (A.src !== 'file') h += choice('merge', 'Merge into ' + P.target, 'Adds new items and updates items with the same ID; keeps everything else.' + (A.src === 'json' ? ' Use this for the deck prompt’s add and upgrade jobs.' : ''));
      h += choice('replace', 'Replace ' + P.target, 'The site’s copy becomes exactly this deck.') + choice('new', 'Publish as a separate file', 'Both files stay; they share progress because the ID is the same.');
    }
    if (P.mode === 'new') h += '<label class="f" for="add-name">File name</label><input type="text" id="add-name" value="' + esc(P.name) + '" autocapitalize="off" spellcheck="false">';
    var appNote = A.src === 'json' ? 'Built with UnChalked v' + esc(P.app.info.version) + ' (taken from ' + esc(P.app.name) + ').'
      : A.src === 'link' ? 'Only the deck is copied; it runs in your own app (UnChalked v' + esc(P.app.info.version) + ').'
      : P.app && vnum(P.app.info.version) >= vnum(P.fileVer) ? 'It will use your newest app version, UnChalked v' + esc(P.app.info.version) + ' (the deck itself is unchanged).' : 'Uses the app version inside the file (v' + esc(P.fileVer || '?') + '), newer than your site’s.';
    h += '<p class="tiny muted" style="margin-top:10px">' + appNote + ' It goes live about a minute after publishing.</p>';
    $('add-plan').innerHTML = h;
    Array.prototype.forEach.call(document.querySelectorAll('input[name=add-mode]'), function (r) { r.onchange = function () { P.mode = r.value; renderPlan(); }; });
    var nm = $('add-name'); if (nm) nm.oninput = function () { P.name = nm.value; };
  }
  function choice(v, title, sub) { return '<label class="choice"><input type="radio" name="add-mode" value="' + v + '"' + (A.plan.mode === v ? ' checked' : '') + '><span><b>' + esc(title) + '</b><small>' + esc(sub) + '</small></span></label>'; }

  function publish() {
    var P = A.plan, cfg = syncCfg(); if (!P || !cfg) return;
    var name = P.mode === 'new' ? cleanName(P.name) : P.target;
    if (P.mode === 'new' && (/^(index|404)\.html?$/i.test(name) || !/^[A-Za-z0-9][A-Za-z0-9._-]*\.html?$/.test(name))) { msg('add-msg', 'bad', 'Pick a file name like <code>fin331-exam2.html</code> (letters, numbers, dashes; not index.html).'); return; }
    var go = $('add-go'); go.disabled = true; $('add-check').disabled = true;
    msg('add-msg', 'warn', P.isUpdate ? 'Updating…' : 'Publishing…');
    var deck = JSON.parse(JSON.stringify(P.deck)), counts = null;
    /* A shared link only ever contributes deck DATA: it is wrapped in this site's own app, never the other site's code (which would run
       here, next to this site's token). Only your own .html file may bring a newer app, and only when the site has no newer one. */
    var useOwn = A.src === 'file' && !(P.app && vnum(P.app.info.version) >= vnum(P.fileVer));
    var tplP = useOwn ? Promise.resolve(A.fileText)
      : fetch(encodeURI(P.app.name), { cache: 'no-store' }).then(function (r) { if (!r.ok) throw new Error('Couldn’t load ' + P.app.name + ' to take the app from.'); return r.text(); });
    var baseP = P.mode === 'merge' ? fetch(encodeURI(P.target), { cache: 'no-store' }).then(function (r) { if (!r.ok) throw new Error('Couldn’t load ' + P.target + ' to merge into.'); return r.text(); }) : Promise.resolve('');
    var html = '';
    Promise.all([tplP, baseP]).then(function (got) {
      if (P.mode === 'merge') {
        var base = deckOf(got[1]); if (!base) throw new Error(P.target + ' has no readable deck to merge into.');
        var m = mergeDecks(base, deck); deck = m.deck; counts = m.n;
      }
      if (A.src === 'link') { deck.meta = deck.meta || {}; deck.meta.sharedFrom = { url: A.linkUrl, deckHash: P.srcHash }; }   /* lets this copy notice when the friend updates theirs */
      html = buildHtml(got[0], deck);
      return gh('/repos/' + REPO + '/contents/' + encodeURIComponent(name) + '?ref=' + encodeURIComponent(BRANCH), { token: cfg.token });
    }).then(function (r) {
      if (r.status === 401) throw new Error('GitHub rejected the token (expired?). Tap Token at the top and connect a new one.');
      var sha = r.status === 200 && r.json && r.json.sha ? r.json.sha : null;
      if (P.mode === 'new' && sha) throw new Error('A file named ' + name + ' already exists. Choose another name, or Replace.');
      var verb = sha ? 'Update ' : 'Add ';
      var body = { message: verb + name + (A.src === 'link' ? ' (shared by ' + ownerOf(A.linkUrl) + ')' : '') + ' from the UnChalked launcher', content: b64(html), branch: BRANCH };
      if (sha) body.sha = sha;
      return gh('/repos/' + REPO + '/contents/' + encodeURIComponent(name), { method: 'PUT', token: cfg.token, body: body });
    }).then(function (r) {
      if (r.status === 401) throw new Error('GitHub rejected the token (expired?). Tap Token at the top and connect a new one.');
      if (r.status === 403 || r.status === 404) throw new Error('This token can’t write to <b>' + esc(REPO) + '</b>. On GitHub, edit the token: Repository access → Only select repositories → <b>' + esc(REPO.split('/')[1]) + '</b>, and Repository permissions → <b>Contents: Read and write</b>.');
      if (r.status === 409) throw new Error('The file changed on GitHub at the same moment. Tap Check again, then Publish.');
      if (r.status !== 200 && r.status !== 201) throw new Error(r.status ? 'GitHub answered with an error (' + r.status + ').' : 'Couldn’t reach GitHub. Check your connection.');
      var c = load() || { files: [], decks: {}, at: Date.now() }, sha = r.json && r.json.content ? r.json.content.sha : '';
      if (!c.files.some(function (f) { return f.name === name; })) c.files.push({ name: name, sha: sha });
      c.files.forEach(function (f) { if (f.name === name) f.sha = sha; });
      c.decks[name] = { sha: sha, info: parse(name, html) };
      if (A.src === 'link') { var all = sharedState(); all[A.linkUrl] = Object.assign({}, all[A.linkUrl] || {}, { deckHash: P.srcHash, checkedAt: Date.now(), missing: false }); saveShared(all); }
      save(c); pending[name] = hash(html); render(c, (P.isUpdate ? 'Updated ' : 'Published ') + name);
      watch(name, 0);
      msg('add-msg', 'ok', (counts ? 'Merged: ' + plural(counts.added, 'new item') + ', ' + plural(counts.updated, 'updated item') + '. ' : '') + (P.isUpdate ? 'Updated ' : 'Published ') + '<b>' + esc(name) + '</b>. It goes live in about a minute; the card says “Publishing…” until then.');
      $('add-foot').innerHTML = '<button type="button" class="btn primary" data-close>Done</button>';
    }).catch(function (e) {
      msg('add-msg', 'bad', e.message || 'Something went wrong.');
      if ($('add-go')) $('add-go').disabled = false; if ($('add-check')) $('add-check').disabled = false;
    });
  }
  function watch(name, n) {   /* poll the site until it serves exactly what was published (GitHub Pages takes ~1 min) */
    if (!pending[name]) return;
    if (n > 24) { delete pending[name]; render(load()); return; }
    setTimeout(function () {
      fetch(encodeURI(name) + '?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.ok ? r.text() : ''; }, function () { return ''; }).then(function (t) {
        if (t && hash(t) === pending[name]) { delete pending[name]; render(load(), name + ' is live'); }
        else watch(name, n + 1);
      });
    }, n ? 10000 : 20000);
  }

  /* ---------- wiring ---------- */
  document.addEventListener('click', function (e) { var t = e.target.closest && e.target.closest('[data-close]'); if (t) { var d = t.closest('dialog'); if (d) d.close(); } });
  $('sync-btn').addEventListener('click', function () { openToken(false); });
  $('add-deck').addEventListener('click', function () { openAdd(); });
  $('dlg-token').addEventListener('close', renderSync);
  var cached = load();
  if (cached) render(cached, plural(cached.files.length, 'file') + ' · checked ' + ago(cached.at));
  renderSync(); refreshBranch();
  $('refresh').addEventListener('click', function () { refresh(true).then(function () { checkUpdates(true); }); });
  window.addEventListener('pageshow', function (e) { if (e.persisted) { var c = load(); if (c) render(c); renderSync(); } });   /* back from a deck: refresh "Studied" times and sync status */
  refresh(false).then(function () { checkUpdates(false); });
})();
</script>
</body>
